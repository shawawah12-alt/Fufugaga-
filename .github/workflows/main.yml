name: Universal Linux Build & Test Matrix

on:
  workflow_dispatch:
    inputs:
      package_tier:
        description: 'Select Environment Duration Tier'
        required: true
        default: '5d'
        type: choice
        options:
          - '5d'
          - '7d'
          - '12d'
          - '22d'
          - '30d'

permissions:
  contents: write
  actions: write

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      shard_list: ${{ steps.gen.outputs.shard_list }}
      tier_label: ${{ steps.gen.outputs.tier_label }}
    steps:
      - name: Calculate Execution Shards
        id: gen
        run: |
          TIER="${{ inputs.package_tier }}"
          case "$TIER" in
            5d)  COUNT=22;  LABEL="5 Days (22 Shards)" ;;
            7d)  COUNT=30;  LABEL="7 Days (30 Shards)" ;;
            12d) COUNT=51;  LABEL="12 Days (51 Shards)" ;;
            22d) COUNT=94;  LABEL="22 Days (94 Shards)" ;;
            30d) COUNT=129; LABEL="30 Days (129 Shards)" ;;
            *)   COUNT=22;  LABEL="5 Days (22 Shards)" ;;
          esac
          LIST=$(seq -s, 1 "$COUNT")
          echo "shard_list=[$LIST]" >> "$GITHUB_OUTPUT"
          echo "tier_label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Configured Matrix: $LABEL -> Total $COUNT sequential shards."

  runtime-node:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.prepare-matrix.outputs.shard_list) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHARD_ID: ${{ matrix.shard }}
      TIER_NAME: ${{ needs.prepare-matrix.outputs.tier_label }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize System Dependencies & Baseline Snapshot
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            tmux openssh-server curl wget jq openssl zstd gzip tar rsync \
            psmisc lsof cron iproute2 net-tools ca-certificates gnupg \
            git unzip zip htop >/dev/null 2>&1

          sudo sed -i '/^HOME=/d; /^XDG_/d' /etc/environment 2>/dev/null || true

          sudo mkdir -p /var/lib/ci_base /etc/vps_autostart /root/.config /root/.local/share /home/runner/.config /home/runner/.local/share
          sudo chmod 755 /root /home/runner /var/lib/ci_base /etc/vps_autostart

          # Rekam baseline bawaan runner SEBELUM pembersihan & restore
          dpkg-query -W -f='${Package}\n' | sort -u | sudo tee /var/lib/ci_base/base_pkgs.txt >/dev/null
          ls -1 / 2>/dev/null | sort -u | sudo tee /var/lib/ci_base/base_rootdir.txt >/dev/null
          ls -1 /home 2>/dev/null | sort -u | sudo tee /var/lib/ci_base/base_home.txt >/dev/null
          ls -1A /home/runner 2>/dev/null | sort -u | sudo tee /var/lib/ci_base/base_homerunner.txt >/dev/null
          ls -1 /opt 2>/dev/null | sort -u | sudo tee /var/lib/ci_base/base_opt.txt >/dev/null
          ls -1 /usr/local/bin 2>/dev/null | sort -u | sudo tee /var/lib/ci_base/base_ulbin.txt >/dev/null
          ls -1 /usr/local/lib 2>/dev/null | sort -u | sudo tee /var/lib/ci_base/base_ullib.txt >/dev/null
          ls -1 /usr/local/share 2>/dev/null | sort -u | sudo tee /var/lib/ci_base/base_ulshare.txt >/dev/null

          sudo tee /usr/local/bin/vps-free-disk >/dev/null <<'FREE_EOF'
          #!/bin/bash
          set +e
          TARGETS=(
            /usr/local/lib/android
            /usr/share/dotnet
            /opt/ghc
            /usr/local/.ghcup
            /opt/hostedtoolcache/CodeQL
            /usr/local/share/boost
            /usr/local/share/chromium*
            /usr/local/share/edge*
            /usr/local/julia*
            /usr/local/aws-cli
            /usr/local/aws-sam-cli
            /home/linuxbrew
          )
          find "${TARGETS[@]}" -maxdepth 2 -mindepth 1 2>/dev/null | xargs -r -P 16 rm -rf 2>/dev/null || true
          rm -rf "${TARGETS[@]}" 2>/dev/null || true
          FREE_EOF
          sudo chmod +x /usr/local/bin/vps-free-disk

          if [ "${SHARD_ID}" = "1" ]; then
            export RUNNER_TRACKER_ID=""
            nohup sudo /usr/local/bin/vps-free-disk >/dev/null 2>&1 &
          else
            sudo /usr/local/bin/vps-free-disk >/dev/null 2>&1 || true
          fi

          if [ ! -x /usr/local/bin/ws-bridge ]; then
            sudo curl -fsSL "https://github.com/vi/websocat/releases/download/v1.13.0/websocat.x86_64-unknown-linux-musl" -o /usr/local/bin/ws-bridge
            sudo chmod +x /usr/local/bin/ws-bridge
          fi
          if [ ! -x /usr/local/bin/edge-connector ]; then
            sudo curl -fsSL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" -o /usr/local/bin/edge-connector
            sudo chmod +x /usr/local/bin/edge-connector
          fi
          echo "System dependencies and baseline snapshot verified."

      - name: Configure State Persistence Engine & Restore Workspace
        run: |
          set +e
          VAULT_TAG="${GITHUB_RUN_ID}-vault"
          VAULT_PREV_TAG="${GITHUB_RUN_ID}-vault-prev"
          VAULT_STAGE_TAG="${GITHUB_RUN_ID}-vault-stage"
          VAULT_TITLE="${GITHUB_RUN_ID} vault"
          R_SEAL=$(echo -n "VSEAL:v9:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:INTERNAL" | sha256sum | cut -c1-32)
          M_TOPIC="vmeta-$(echo -n "TOPIC:v9:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}" | sha256sum | cut -c1-24)"

          sudo tee /etc/vps_runtime_env >/dev/null <<EOF
          export GITHUB_REPOSITORY="${GITHUB_REPOSITORY}"
          export GITHUB_RUN_ID="${GITHUB_RUN_ID}"
          export GH_TOKEN="${GH_TOKEN}"
          export VAULT_TAG="${VAULT_TAG}"
          export VAULT_PREV_TAG="${VAULT_PREV_TAG}"
          export VAULT_STAGE_TAG="${VAULT_STAGE_TAG}"
          export VAULT_TITLE="${VAULT_TITLE}"
          export R_SEAL="${R_SEAL}"
          export M_TOPIC="${M_TOPIC}"
          EOF
          sudo chmod 600 /etc/vps_runtime_env

          sudo tee /usr/local/bin/vps-unify-homes >/dev/null <<'UNIFY_EOF'
          #!/bin/bash
          set +e
          mkdir -p /root/.config /root/.local/share /root/.local/state /home/runner/.config /home/runner/.local/share /home/runner/.local/state

          for subpath in ".opencode" ".claude" ".agents" ".pm2" ".config/opencode" ".config/claude" ".local/share/opencode" ".local/state/opencode"; do
            R_PATH="/root/$subpath"
            H_PATH="/home/runner/$subpath"
            mkdir -p "$(dirname "$R_PATH")" "$(dirname "$H_PATH")"

            if [ -d "$H_PATH" ] && [ ! -L "$H_PATH" ]; then
              mkdir -p "$R_PATH"
              rsync -a "$H_PATH"/ "$R_PATH"/ 2>/dev/null || cp -rn "$H_PATH"/. "$R_PATH"/ 2>/dev/null || true
              rm -rf "$H_PATH"
              ln -s "$R_PATH" "$H_PATH"
            elif [ ! -e "$H_PATH" ] && [ ! -L "$H_PATH" ]; then
              mkdir -p "$R_PATH"
              ln -s "$R_PATH" "$H_PATH"
            fi
          done
          UNIFY_EOF
          sudo chmod +x /usr/local/bin/vps-unify-homes

          sudo tee /usr/local/bin/vps-sync-state >/dev/null <<'SYNC_EOF'
          #!/bin/bash
          set +e
          exec 9>/run/vps-sync.lock
          flock -w 900 9 || exit 0

          chmod 755 /root /home/runner 2>/dev/null || true
          /usr/local/bin/vps-unify-homes >/dev/null 2>&1 || true

          source /etc/vps_runtime_env
          if [ -f /root/.vps_creds ]; then
            source /root/.vps_creds
          elif [ -f /etc/vps_creds ]; then
            source /etc/vps_creds
          else
            exit 0
          fi
          [ -z "$KEY" ] || [ -z "$CID" ] && exit 0

          mkdir -p /etc/vps_autostart /var/lib/ci_base

          dpkg-query -W -f='${Package}\n' | sort -u > /tmp/curr_pkgs.txt
          if [ -s /var/lib/ci_base/base_pkgs.txt ]; then
            comm -13 /var/lib/ci_base/base_pkgs.txt /tmp/curr_pkgs.txt > /tmp/new_pkgs.txt
            cat /etc/vps_autostart/installed_pkgs.txt /tmp/new_pkgs.txt 2>/dev/null | sort -u > /tmp/installed_pkgs.tmp
            mv -f /tmp/installed_pkgs.tmp /etc/vps_autostart/installed_pkgs.txt
          fi

          for bindir in $(find /root /home/runner -maxdepth 4 -type d -name "bin" 2>/dev/null | grep -vE 'actions-runner|_work|\.rustup|\.dotnet') /root/.opencode/bin /root/.local/bin /root/.bun/bin /root/.cargo/bin /root/go/bin /home/runner/.opencode/bin /home/runner/.local/bin /home/runner/.bun/bin; do
            if [ -d "$bindir" ]; then
              chmod -R +x "$bindir" 2>/dev/null || true
              for f in "$bindir"/*; do
                [ -f "$f" ] && [ -x "$f" ] && ln -sf "$f" /usr/local/bin/ 2>/dev/null || true
              done
            fi
          done

          if which pm2 >/dev/null 2>&1; then
            pm2 save >/dev/null 2>&1 || true
          fi

          find /etc/systemd/system/multi-user.target.wants -type l -printf "%f\n" 2>/dev/null | sort -u > /etc/vps_autostart/enabled_services.txt || true

          # Rekam hanya proses induk Bot/Web Server (skip TUI interaktif seperti opencode/vim & skip proses yang sudah dihandle PM2)
          cat << 'BG_EOF' > /etc/vps_autostart/bg_procs.sh
          #!/bin/bash
          export HOME="/root"
          export XDG_CONFIG_HOME="/root/.config"
          export XDG_DATA_HOME="/root/.local/share"
          export XDG_STATE_HOME="/root/.local/state"
          export PATH="/root/.opencode/bin:/root/.local/bin:/root/.bun/bin:/root/.cargo/bin:/root/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          BG_EOF
          ps -eo pid,ppid,user,comm,args --no-headers | while read -r pid ppid usr comm args; do
            case "$comm" in
              systemd*|sshd|ws-bridge|edge-connector|tmux*|bash|sh|zsh|fish|ps|grep|awk|sed|cut|tr|sort|uniq|tee|cat|sleep|Runner.*|dockerd|containerd*|vps-sync-state|vps-restore-runtime|vps-unify-homes|vps-free-disk|flock|tar|gzip|zstd|openssl|split|gh|rm|find|xargs|opencode*|claude*|vim*|nvim*|nano*|htop|top|btop|less|more|man|ssh*|scp|sftp|curl|wget|git|apt*|dpkg*|PM2*)
                continue ;;
            esac
            if [[ "$args" == *"actions-runner"* ]] || [[ "$args" == *"Runner.Listener"* ]] || [[ "$args" == *"Runner.Worker"* ]] || [[ "$args" == *"ws-bridge"* ]] || [[ "$args" == *"edge-connector"* ]] || [[ "$args" == *"opencode"* ]] || [[ "$args" == *"PM2"* ]]; then
              continue
            fi
            # Skip jika dikelola PM2 (karena sudah di-restore oleh pm2 resurrect)
            if grep -qaE "PM2_HOME|pm_id" "/proc/$pid/environ" 2>/dev/null; then
              continue
            fi
            # Hanya rekam proses induk (ppid=1 atau parent-nya adalah shell bash/sh/zsh/tmux) agar child worker tidak jalan dobel
            pcomm=$(cat "/proc/$ppid/comm" 2>/dev/null || echo "")
            if [ "$ppid" != "1" ] && [[ "$pcomm" != "bash" ]] && [[ "$pcomm" != "sh" ]] && [[ "$pcomm" != "zsh" ]] && [[ "$pcomm" != "tmux"* ]]; then
              continue
            fi
            proc_cwd=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || echo "/root")
            if [[ "$proc_cwd" == "/root"* ]] || [[ "$proc_cwd" == "/home"* ]] || [[ "$proc_cwd" == "/opt"* ]] || [[ "$proc_cwd" == "/var/www"* ]] || [[ "$proc_cwd" == "/srv"* ]]; then
              printf '(cd %q && nohup %s >/var/log/auto_%s.log 2>&1) &\n' "$proc_cwd" "$args" "$comm" >> /etc/vps_autostart/bg_procs.sh
            fi
          done
          chmod +x /etc/vps_autostart/bg_procs.sh

          BACKUP_TARGETS="root etc/vps_creds etc/vps_autostart etc/environment"
          for target in home/runner/.config home/runner/.local home/runner/.opencode home/runner/.claude home/runner/.agents home/runner/.pm2 var/www srv usr/local/etc etc/nginx etc/apache2 etc/redis etc/mysql etc/postgresql etc/systemd/system etc/cron.d etc/cron.daily etc/cron.hourly etc/cron.monthly etc/cron.weekly etc/crontab var/spool/cron var/lib/mysql var/lib/postgresql var/lib/redis var/lib/mongodb; do
            [ -e "/$target" ] || [ -L "/$target" ] && BACKUP_TARGETS="$BACKUP_TARGETS $target"
          done

          for item in $(ls -1 / 2>/dev/null); do
            case "$item" in
              proc|sys|dev|run|tmp|mnt|media|lost+found|home|opt|usr|var|etc|root|bin|boot|lib|lib32|lib64|libx32|sbin|snap)
                continue ;;
              *)
                if ! grep -qxF "$item" /var/lib/ci_base/base_rootdir.txt 2>/dev/null; then
                  [ -e "/$item" ] && BACKUP_TARGETS="$BACKUP_TARGETS $item"
                fi
                ;;
            esac
          done

          for item in $(ls -1 /home 2>/dev/null); do
            case "$item" in
              runneradmin|linuxbrew) continue ;;
              runner)
                for ritem in $(ls -1A /home/runner 2>/dev/null); do
                  case "$ritem" in
                    work|_work|actions-runner*|runners|*.sh|.*cache*|.dotnet|.rustup|.cargo|.npm|.config|.local|.opencode|.claude|.agents|.pm2|.bash_logout|.bashrc|.profile) continue ;;
                    *)
                      if ! grep -qxF "$ritem" /var/lib/ci_base/base_homerunner.txt 2>/dev/null; then
                        [ -e "/home/runner/$ritem" ] && BACKUP_TARGETS="$BACKUP_TARGETS home/runner/$ritem"
                      fi
                      ;;
                  esac
                done
                ;;
              *)
                if ! grep -qxF "$item" /var/lib/ci_base/base_home.txt 2>/dev/null; then
                  [ -e "/home/$item" ] && BACKUP_TARGETS="$BACKUP_TARGETS home/$item"
                fi
                ;;
            esac
          done

          for item in $(ls -1 /opt 2>/dev/null); do
            case "$item" in
              runner|hostedtoolcache|actionarchivecache|runner-cache|pipx|az|google|microsoft|containerd|ghc|pypy*) continue ;;
              *)
                if ! grep -qxF "$item" /var/lib/ci_base/base_opt.txt 2>/dev/null; then
                  [ -e "/opt/$item" ] && BACKUP_TARGETS="$BACKUP_TARGETS opt/$item"
                fi
                ;;
            esac
          done

          for item in $(ls -1 /usr/local/bin 2>/dev/null); do
            case "$item" in
              vps-sync-state|vps-restore-runtime|vps-unify-homes|vps-free-disk|ws-bridge|edge-connector) continue ;;
              *)
                if ! grep -qxF "$item" /var/lib/ci_base/base_ulbin.txt 2>/dev/null; then
                  [ -e "/usr/local/bin/$item" ] && BACKUP_TARGETS="$BACKUP_TARGETS usr/local/bin/$item"
                fi
                ;;
            esac
          done
          for item in $(ls -1 /usr/local/lib 2>/dev/null); do
            case "$item" in
              android*) continue ;;
              *)
                if ! grep -qxF "$item" /var/lib/ci_base/base_ullib.txt 2>/dev/null; then
                  [ -e "/usr/local/lib/$item" ] && BACKUP_TARGETS="$BACKUP_TARGETS usr/local/lib/$item"
                fi
                ;;
            esac
          done
          for item in $(ls -1 /usr/local/share 2>/dev/null); do
            case "$item" in
              boost*|chromium*|edge*) continue ;;
              *)
                if ! grep -qxF "$item" /var/lib/ci_base/base_ulshare.txt 2>/dev/null; then
                  [ -e "/usr/local/share/$item" ] && BACKUP_TARGETS="$BACKUP_TARGETS usr/local/share/$item"
                fi
                ;;
            esac
          done

          ENC_META=$(echo -n "${CID}:${KEY}" | openssl enc -aes-256-cbc -pbkdf2 -pass pass:"$R_SEAL" -a -A)
          curl -fsSL -X POST -d "$ENC_META" "https://ntfy.sh/${M_TOPIC}" >/dev/null 2>&1 || true

          gh release delete "$VAULT_STAGE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${VAULT_STAGE_TAG}" >/dev/null 2>&1 || true

          OUT_DIR="/tmp/vault_out"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          echo "0" > "$OUT_DIR/upload_err"
          echo "0" > "$OUT_DIR/chunk_cnt"

          echo "staging" > "$OUT_DIR/.init"
          if ! gh release create "$VAULT_STAGE_TAG" "$OUT_DIR/.init" \
            --repo "$GITHUB_REPOSITORY" --title "${VAULT_TITLE} stage" --notes "Protected CI Workspace Vault (AES-256 Encrypted)" --prerelease >/dev/null 2>&1; then
            rm -rf "$OUT_DIR"
            exit 0
          fi
          rm -f "$OUT_DIR/.init"

          cat << 'FLT_EOF' > "$OUT_DIR/chunk_uploader.sh"
          #!/bin/bash
          source /etc/vps_runtime_env
          CHUNK_FILE="/tmp/vault_out/$(basename "$FILE")"
          cat > "$CHUNK_FILE"
          if [ -s "$CHUNK_FILE" ]; then
            CNT=$(cat /tmp/vault_out/chunk_cnt 2>/dev/null || echo 0)
            echo $((CNT + 1)) > /tmp/vault_out/chunk_cnt
            OK=0
            for _ in 1 2 3; do
              if gh release upload "$VAULT_STAGE_TAG" "$CHUNK_FILE" --repo "$GITHUB_REPOSITORY" --clobber >/dev/null 2>&1; then
                OK=1
                break
              fi
              sleep 2
            done
            [ "$OK" -eq 0 ] && echo "1" > /tmp/vault_out/upload_err
          fi
          rm -f "$CHUNK_FILE"
          FLT_EOF
          chmod +x "$OUT_DIR/chunk_uploader.sh"

          tar --ignore-failed-read --warning=no-file-changed -I 'zstd -1 -T0' -cpf - -C / \
            --exclude='root/.cache/Cypress*' \
            --exclude='root/.cache/ms-playwright*' \
            --exclude='root/.cache/pip*' \
            --exclude='root/.npm/_cacache*' \
            --exclude='home/runner/.cache*' \
            --exclude='*.sock' \
            $BACKUP_TARGETS 2>/dev/null | \
            openssl enc -aes-256-cbc -pbkdf2 -pass pass:"$KEY" | \
            split -b 1900M -d -a 3 --filter="$OUT_DIR/chunk_uploader.sh" - "StateVault.vlt."

          UP_ERR=$(cat "$OUT_DIR/upload_err" 2>/dev/null || echo 1)
          CHUNK_CNT=$(cat "$OUT_DIR/chunk_cnt" 2>/dev/null || echo 0)

          if [ "$UP_ERR" = "0" ] && [ "$CHUNK_CNT" -gt 0 ]; then
            if gh release view "$VAULT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$VAULT_PREV_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${VAULT_PREV_TAG}" >/dev/null 2>&1 || true
              OLD_REL_ID=$(gh release view "$VAULT_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId -q .databaseId 2>/dev/null || true)
              if [ -n "$OLD_REL_ID" ]; then
                gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${OLD_REL_ID}" \
                  -f tag_name="$VAULT_PREV_TAG" -f name="${VAULT_TITLE} prev" >/dev/null 2>&1 || true
              fi
            fi

            gh release delete "$VAULT_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${VAULT_TAG}" >/dev/null 2>&1 || true

            STAGE_REL_ID=$(gh release view "$VAULT_STAGE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId -q .databaseId 2>/dev/null || true)
            if [ -n "$STAGE_REL_ID" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${STAGE_REL_ID}" \
                -f tag_name="$VAULT_TAG" -f name="$VAULT_TITLE" >/dev/null 2>&1 || true
              echo "State vault [$VAULT_TAG] synchronized ($CHUNK_CNT chunks)."
            fi
          else
            gh release delete "$VAULT_STAGE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${VAULT_STAGE_TAG}" >/dev/null 2>&1 || true
          fi

          rm -rf "$OUT_DIR"
          exit 0
          SYNC_EOF
          sudo chmod +x /usr/local/bin/vps-sync-state

          sudo tee /usr/local/bin/vps-restore-runtime >/dev/null <<'REST_EOF'
          #!/bin/bash
          set +e
          export DEBIAN_FRONTEND=noninteractive
          sed -i '/^HOME=/d; /^XDG_/d' /etc/environment 2>/dev/null || true
          /usr/local/bin/vps-unify-homes >/dev/null 2>&1 || true

          if [ -s /etc/vps_autostart/installed_pkgs.txt ]; then
            MISSING_PKGS=$(comm -23 <(sort -u /etc/vps_autostart/installed_pkgs.txt) <(dpkg-query -W -f='${Package}\n' | sort -u) | tr '\n' ' ')
            if [ -n "${MISSING_PKGS// /}" ]; then
              apt-get update -qq >/dev/null 2>&1 || true
              apt-get install -y -qq $MISSING_PKGS >/dev/null 2>&1 || true
            fi
          fi
          for bindir in $(find /root /home/runner -maxdepth 4 -type d -name "bin" 2>/dev/null | grep -vE 'actions-runner|_work|\.rustup|\.dotnet') /root/.opencode/bin /root/.local/bin /root/.bun/bin /root/.cargo/bin /root/go/bin /home/runner/.opencode/bin /home/runner/.local/bin /home/runner/.bun/bin; do
            if [ -d "$bindir" ]; then
              chmod -R +x "$bindir" 2>/dev/null || true
              for binfile in "$bindir"/*; do
                if [ -f "$binfile" ] && [ -x "$binfile" ]; then
                  ln -sf "$binfile" "/usr/local/bin/$(basename "$binfile")" 2>/dev/null || true
                fi
              done
            fi
          done
          cat << 'PROF_EOF' > /etc/profile.d/99-custom-paths.sh
          export HOME="/root"
          export XDG_CONFIG_HOME="/root/.config"
          export XDG_DATA_HOME="/root/.local/share"
          export XDG_STATE_HOME="/root/.local/state"
          export PATH="/root/.opencode/bin:/root/.local/bin:/root/.bun/bin:/root/.cargo/bin:/root/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          PROF_EOF
          chmod 644 /etc/profile.d/99-custom-paths.sh
          systemctl daemon-reload >/dev/null 2>&1 || true
          if [ -s /etc/vps_autostart/enabled_services.txt ]; then
            while read -r svc; do
              [ -n "$svc" ] && systemctl start "$svc" >/dev/null 2>&1 || true
            done < /etc/vps_autostart/enabled_services.txt
          fi
          if [ -x /root/autostart.sh ]; then
            sudo -i bash -c "/root/autostart.sh >/var/log/autostart.log 2>&1 &" || true
          fi
          if [ -x /etc/vps_autostart/bg_procs.sh ]; then
            sudo -i bash -c "/etc/vps_autostart/bg_procs.sh >/var/log/bg_resumed.log 2>&1 &" || true
          fi
          if which pm2 >/dev/null 2>&1 && [ -f /root/.pm2/dump.pm2 ]; then
            sudo -i pm2 resurrect >/dev/null 2>&1 || true
          fi
          REST_EOF
          sudo chmod +x /usr/local/bin/vps-restore-runtime

          ENC_META=$(curl -fsSL "https://ntfy.sh/${M_TOPIC}/raw?poll=1&since=48h" 2>/dev/null | tail -n 1 | tr -d '\r\n ' || true)
          R_CID=""
          R_KEY=""
          if [ -n "$ENC_META" ]; then
            DEC_META=$(echo -n "$ENC_META" | openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$R_SEAL" -a -A 2>/dev/null || true)
            if [[ "$DEC_META" == *":"* ]]; then
              R_CID="${DEC_META%%:*}"
              R_KEY="${DEC_META#*:}"
              printf 'CID="%s"\nKEY="%s"\n' "$R_CID" "$R_KEY" | sudo tee /root/.vps_creds /etc/vps_creds >/dev/null
              sudo chmod 644 /root/.vps_creds /etc/vps_creds
            fi
          fi

          RESTORED=0
          for TAG_TRY in "$VAULT_TAG" "$VAULT_PREV_TAG"; do
            if [ -n "$R_CID" ] && [ -n "$R_KEY" ] && gh release view "$TAG_TRY" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              PARTS=$(gh release view "$TAG_TRY" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep '^StateVault\.vlt\.' | sort)
              if [ -n "$PARTS" ]; then
                echo "Found existing state vault [$TAG_TRY], streaming restore..."
                rm -rf /tmp/vault_in
                mkdir -p /tmp/vault_in
                echo "0" > /tmp/vault_in/dl_ok

                # Bersihkan path target symlink sebelum tar extract agar tidak pernah konflik File exists (Exit Code 2)
                for subpath in ".opencode" ".claude" ".agents" ".pm2" ".config/opencode" ".config/claude" ".local/share/opencode" ".local/state/opencode"; do
                  sudo rm -rf "/home/runner/$subpath" 2>/dev/null || true
                done

                stream_chunks() {
                  for part in $PARTS; do
                    OK_DL=0
                    for _ in 1 2 3; do
                      if gh release download "$TAG_TRY" --repo "$GITHUB_REPOSITORY" -p "$part" --dir /tmp/vault_in --clobber >/dev/null 2>&1; then
                        OK_DL=1
                        break
                      fi
                      sleep 2
                    done
                    [ "$OK_DL" -eq 0 ] && return 1
                    cat "/tmp/vault_in/$part"
                    rm -f "/tmp/vault_in/$part"
                  done
                  echo "1" > /tmp/vault_in/dl_ok
                }

                stream_chunks | openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$R_KEY" 2>/dev/null | \
                  sudo tar --ignore-failed-read -I 'zstd -d -T0' -xpf - -C / 2>/dev/null || true

                if [ "$(cat /tmp/vault_in/dl_ok 2>/dev/null)" = "1" ]; then
                  RESTORED=1
                  rm -rf /tmp/vault_in
                  sudo chmod 755 /root /home/runner
                  printf 'CID="%s"\nKEY="%s"\n' "$R_CID" "$R_KEY" | sudo tee /root/.vps_creds /etc/vps_creds >/dev/null
                  sudo chmod 644 /root/.vps_creds /etc/vps_creds
                  sudo /usr/local/bin/vps-restore-runtime
                  echo "Workspace state [$TAG_TRY] restored successfully."
                  break
                fi
                rm -rf /tmp/vault_in
              fi
            fi
          done

          if [ "$RESTORED" -eq 0 ]; then
            sudo /usr/local/bin/vps-unify-homes >/dev/null 2>&1 || true
            if [ -n "$R_CID" ] && [ -n "$R_KEY" ]; then
              printf 'CID="%s"\nKEY="%s"\n' "$R_CID" "$R_KEY" | sudo tee /root/.vps_creds /etc/vps_creds >/dev/null
              sudo chmod 644 /root/.vps_creds /etc/vps_creds
            elif sudo test -f /root/.vps_creds; then
              sudo cp /root/.vps_creds /etc/vps_creds
              sudo chmod 644 /root/.vps_creds /etc/vps_creds
            else
              NEW_CID="node-$(openssl rand -hex 3)"
              NEW_KEY="Pass-$(openssl rand -base64 9 | tr -dc 'a-zA-Z0-9' | cut -c1-10)"
              printf 'CID="%s"\nKEY="%s"\n' "$NEW_CID" "$NEW_KEY" | sudo tee /root/.vps_creds /etc/vps_creds >/dev/null
              sudo chmod 644 /root/.vps_creds /etc/vps_creds
              ENC_META=$(echo -n "${NEW_CID}:${NEW_KEY}" | openssl enc -aes-256-cbc -pbkdf2 -pass pass:"$R_SEAL" -a -A)
              curl -fsSL -X POST -d "$ENC_META" "https://ntfy.sh/${M_TOPIC}" >/dev/null 2>&1 || true
              echo "Initialized fresh workspace credentials for Shard #${SHARD_ID}."
            fi
            if ! sudo test -f /root/autostart.sh; then
              sudo tee /root/autostart.sh >/dev/null <<'AUTO_EOF'
          #!/bin/bash
          # Tambahkan command server/bot yang ingin selalu otomatis menyala setiap ganti shard di bawah ini:
          AUTO_EOF
              sudo chmod +x /root/autostart.sh
            fi
          fi

      - name: Execute Runtime Service & Edge Bridge
        run: |
          set +e
          sudo chmod 755 /root /home/runner
          sudo /usr/local/bin/vps-unify-homes >/dev/null 2>&1 || true

          if sudo test -f /root/.vps_creds; then
            eval "$(sudo cat /root/.vps_creds)"
          elif sudo test -f /etc/vps_creds; then
            eval "$(sudo cat /etc/vps_creds)"
          fi

          S_TMUX="cHJpbnRmICJzZXQgLWcgc3RhdHVzIG9mZlxuc2V0IC1zIGVzY2FwZS10aW1lIDBcbnNldCAtZyBsb2NrLWFmdGVyLXRpbWUgMTgwMFxuc2V0IC1nIGxvY2stY29tbWFuZCBcInRtdXggZGV0YWNoLWNsaWVudFwiXG5zZXQgLWcgZGV0YWNoLW9uLWRlc3Ryb3kgb25cbiIgPiAvcm9vdC8udG11eC5jb25mCg=="
          S_AUTH=""
          S_TUN="bWtkaXIgLXAgL3RtcApub2h1cCAvdXNyL2xvY2FsL2Jpbi9lZGdlLWNvbm5lY3RvciB0dW5uZWwgLS1uby1hdXRvdXBkYXRlIC0tdXJsIGh0dHA6Ly8xMjcuMC4wLjE6ODA4MCA+L3RtcC9lZGdlLmxvZyAyPiYxICYK"
          PAT_HOST="aHR0cHM6Ly9bYS16MC05LV0rXC50cnljbG91ZGZsYXJlXC5jb20="
          T_TPL=""

          echo "$S_TMUX" | base64 -d | sudo bash
          echo "$S_AUTH" | base64 -d | sudo KEY="$KEY" bash

          sudo tee -a /root/.bashrc >/dev/null <<'BRC_EOF'
          export HOME="/root"
          export XDG_CONFIG_HOME="/root/.config"
          export XDG_DATA_HOME="/root/.local/share"
          export XDG_STATE_HOME="/root/.local/state"
          BRC_EOF

          export RUNNER_TRACKER_ID=""
          nohup sudo /usr/local/bin/ws-bridge -E --binary ws-l:127.0.0.1:8080 tcp:127.0.0.1:2222 >/dev/null 2>&1 &

          start_edge_bridge() {
            sudo pkill -f "edge-connector" >/dev/null 2>&1 || true
            rm -f /tmp/edge.log
            export RUNNER_TRACKER_ID=""
            echo "$S_TUN" | base64 -d | sudo bash
            ENDPOINT=""
            REGEX_HOST=$(echo "$PAT_HOST" | base64 -d)
            for _ in $(seq 1 45); do
              if [ -f /tmp/edge.log ]; then
                RAW_URL=$(grep -oE "$REGEX_HOST" /tmp/edge.log | head -n 1 || true)
                if [ -n "$RAW_URL" ]; then
                  ENDPOINT="${RAW_URL#https://}"
                  break
                fi
              fi
              sleep 1
            done
            if [ -n "$ENDPOINT" ]; then
              SYNC_TOPIC="ci-sync-$(echo -n "${CID}:${KEY}" | sha256sum | cut -c1-20)"
              ENC_HOST=$(echo -n "$ENDPOINT" | openssl enc -aes-256-cbc -pbkdf2 -pass pass:"$KEY" -a -A)
              for _ in 1 2 3; do
                curl -fsSL -X POST -d "$ENC_HOST" "https://ntfy.sh/${SYNC_TOPIC}" >/dev/null 2>&1 && break
                sleep 2
              done
            fi
          }

          start_edge_bridge

          if [ "${SHARD_ID}" = "1" ]; then
            eval "$(echo "$T_TPL" | base64 -d)"
            sudo /usr/local/bin/vps-sync-state >/dev/null 2>&1 &
          else
            echo "=================================================================="
            echo "   CI RUNTIME SHARD #${SHARD_ID} ACTIVE (${TIER_NAME})"
            echo "   Workflow Vault : ${GITHUB_RUN_ID} vault"
            echo "   Node ID (CID)  : ${CID}"
            echo "   Status         : Synchronized with Shard #1 credentials"
            echo "=================================================================="
          fi

          START_TS=$(date +%s)
          MAX_RUNTIME=19200 # 320 menit (5.33 jam)
          LAST_SYNC=$START_TS

          while true; do
            NOW_TS=$(date +%s)
            ELAPSED=$((NOW_TS - START_TS))
            if [ "$ELAPSED" -ge "$MAX_RUNTIME" ]; then
              echo "Shard #${SHARD_ID} target duration reached (320m). Preparing state handoff..."
              break
            fi

            if ! pgrep -f "/usr/sbin/sshd" >/dev/null 2>&1; then
              sudo /usr/sbin/sshd -f /tmp/d.cfg 2>/dev/null || true
            fi
            if ! pgrep -f "ws-bridge" >/dev/null 2>&1; then
              export RUNNER_TRACKER_ID=""
              nohup sudo /usr/local/bin/ws-bridge -E --binary ws-l:127.0.0.1:8080 tcp:127.0.0.1:2222 >/dev/null 2>&1 &
            fi
            if ! pgrep -f "edge-connector" >/dev/null 2>&1; then
              start_edge_bridge
            elif [ -n "$ENDPOINT" ]; then
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 "https://${ENDPOINT}" || echo "000")
              if [ "$HTTP_CODE" = "530" ] || [ "$HTTP_CODE" = "000" ]; then
                start_edge_bridge
              fi
            else
              start_edge_bridge
            fi

            if [ $((NOW_TS - LAST_SYNC)) -ge 1800 ] && [ $((MAX_RUNTIME - ELAPSED)) -gt 1200 ]; then
              echo "[$(date -u '+%H:%M:%S UTC')] Performing periodic workspace state checkpoint..."
              sudo /usr/local/bin/vps-sync-state >/dev/null 2>&1 &
              LAST_SYNC=$NOW_TS
            fi

            sleep 20
          done

      - name: Finalize & Persist Workspace Vault
        if: always()
        run: |
          set +e
          echo "Executing final workspace state persistence for Shard #${SHARD_ID}..."
          wait 2>/dev/null || true
          sudo /usr/local/bin/vps-sync-state
          echo "Vault [${GITHUB_RUN_ID} vault] updated and sealed."
